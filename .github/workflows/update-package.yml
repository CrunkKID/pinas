# Baut nur das Update-Paket (dauert unter einer Minute) – zum Einspielen im Update-Center des NAS.
# - Manuell starten: Reiter "Actions" → "PiNAS-Update bauen" → "Run workflow"
# - Das Paket wird als GitHub-Release vX.Y.Z (Version aus pinas/VERSION) veröffentlicht,
#   dann findet „Nach Updates suchen“ im NAS es. Installiert wird dort erst nach Bestätigung.
# - Gibt es das Release dieser Version schon, bleibt es unverändert: Neuer Stand = neue Versionsnummer.
# - Zusätzlich als ZIP unter "Artifacts", zum Einspielen von Hand (so wie sie ist, nicht entpacken)
name: PiNAS-Update bauen

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Update-Paket bauen
        id: pkg
        run: |
          VERSION="$(tr -d '[:space:]' < pinas/VERSION)"
          bash image/make-update.sh "pinas-update-$VERSION.tar.gz"
          echo "file=pinas-update-$VERSION.tar.gz" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: pinas-update-${{ steps.pkg.outputs.version }}
          path: ${{ steps.pkg.outputs.file }}
          compression-level: 0

      - name: Gibt es dieses Release schon?
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG gibt es schon und bleibt unverändert. Für einen neuen Stand die Versionsnummer erhöhen."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          # Neuigkeiten dieser Version aus dem Changelog, das NAS zeigt sie vor dem Herunterladen an
          awk -v v="${{ steps.pkg.outputs.version }}" '/^## /{f=($2==v);next} f' pinas/CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "PiNAS ${{ steps.pkg.outputs.version }}" > release-notes.md

      - name: Als Release veröffentlichen
        if: steps.rel.outputs.exists == 'false' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PiNAS ${{ steps.pkg.outputs.version }}
          body_path: release-notes.md
          files: ${{ steps.pkg.outputs.file }}
          make_latest: "true"
