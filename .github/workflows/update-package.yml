# Baut nur das Update-Paket (dauert unter einer Minute) – zum Einspielen im Update-Center des NAS.
# - Manuell starten: Reiter "Actions" → "PiNAS-Update bauen" → "Run workflow"
#   → ZIP unter "Artifacts" herunterladen und im Update-Center hochladen (so wie sie ist, nicht entpacken)
# - Tag pushen (z. B. v1.2.0): Paket wird zusätzlich am GitHub-Release angehängt,
#   dann findet „Nach Updates suchen“ im NAS es automatisch
name: PiNAS-Update bauen

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Update-Paket bauen
        id: pkg
        run: |
          VERSION="$(tr -d '[:space:]' < pinas/VERSION)"
          bash image/make-update.sh "pinas-update-$VERSION.tar.gz"
          echo "file=pinas-update-$VERSION.tar.gz" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: pinas-update-${{ steps.pkg.outputs.version }}
          path: ${{ steps.pkg.outputs.file }}
          compression-level: 0

      - name: Am Release anhängen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.file }}
