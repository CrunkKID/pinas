{% extends "base.html" %}
{% block title %}Anmelden{% endblock %}
{% block mainclass %}login-wrap{% endblock %}
{% block content %}
<form method="post" class="card login">
  <div class="brand big"><span class="logo"></span>PiNAS</div>
  <h1>Willkommen <b>zurück</b></h1>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Benutzername<input name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
  <label>Passwort<input name="password" type="password" autocomplete="current-password" required></label>
  <button class="primary">Anmelden</button>
  <p class="muted login-hint">Browser warnt vor einer unsicheren Verbindung?
    <a href="{{ url_for('tls.index') }}">Sichere Verbindung einrichten</a></p>
</form>
{% endblock %}
