<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PiNAS{% endblock %} · PiNAS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='3' y='4' width='18' height='7' rx='2' fill='%23c51a4a'/><rect x='3' y='13' width='18' height='7' rx='2' fill='%23c51a4a'/></svg>">
</head>
<body>
  {% if user %}
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}"><span class="logo"></span>PiNAS</a>
    <nav>
      <a href="{{ url_for('files.browse', root='privat') }}" class="{{ 'active' if request.blueprint == 'files' }}">Dateien</a>
      <a href="{{ url_for('dashboard.index') }}" class="{{ 'active' if request.blueprint == 'dashboard' }}">Dashboard</a>
      {% if user.is_admin %}
      <a href="{{ url_for('admin.index') }}" class="{{ 'active' if request.blueprint == 'admin' }}">Benutzer</a>
      <a href="{{ url_for('disk.index') }}" class="{{ 'active' if request.blueprint == 'disk' }}">Laufwerk</a>
      {% endif %}
      <a href="{{ url_for('auth.account') }}" class="{{ 'active' if request.endpoint == 'auth.account' }}">{{ user.username }}</a>
      <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="link">Abmelden</button>
      </form>
    </nav>
  </header>
  {% endif %}
  <main class="{% block mainclass %}container{% endblock %}">
    {% for cat, msg in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script>window.CSRF = "{{ csrf_token() }}";</script>
  {% block scripts %}{% endblock %}
</body>
</html>
