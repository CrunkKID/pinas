# Von PiNAS verwaltet – pinas-helper erzeugt daraus /etc/samba/pinas.conf.
# Alle Dateien gehören dem Dienstbenutzer "pinas", damit Web-Oberfläche und
# Netzlaufwerk dieselben Dateien ohne Rechteprobleme bearbeiten können.
# Zugriffsschutz übernimmt Samba über "valid users".
# Zeilen mit @R@ (Papierkorb über das Samba-Modul "recycle") werden nur übernommen,
# wenn das Modul installiert ist. Zeilen mit @A@ (Ereignis-Protokoll über das Modul "full_audit")
# nur, wenn ein Admin das Protokoll im Dashboard eingeschaltet hat. @VFS@ = Liste der aktiven Module.
# full_audit schreibt pro Zugriff eine Zeile ins Systemprotokoll (Kennung smbd_audit), z. B.
#   anna|192.168.178.23|LAPTOP-ANNA|Gemeinsam|openat|ok|w|/srv/nas/shared/Urlaub/IMG_0001.jpg
# PiNAS liest diese Zeilen mit journalctl (siehe pinas/events.py).

[Privat]
   comment = Persoenlicher Ordner
   path = @USERS_DIR@/%U
   # Nur wer „Privat“ in der Weboberfläche eingerichtet hat (Gruppe pinasprivat); alle anderen
   # sehen die Freigabe gar nicht erst
   valid users = @pinasprivat
   access based share enum = yes
   force user = pinas
   force group = pinas
   read only = no
   browseable = yes
   create mask = 0660
   directory mask = 0770
   veto files = /.pinas-upload-*/
   delete veto files = yes
   # Persönliches Speicherlimit (vom Admin gesetzt) als Laufwerksgröße melden
   dfree command = /usr/local/sbin/pinas-dfree
   dfree cache time = 60
@V@   vfs objects = @VFS@
@A@   full_audit:prefix = %u|%I|%m|%S
@A@   full_audit:success = connect openat mkdirat renameat unlinkat
@A@   full_audit:failure = none
@A@   full_audit:facility = LOCAL5
@A@   full_audit:priority = NOTICE
@R@   recycle:repository = .papierkorb
@R@   recycle:keeptree = yes
@R@   recycle:versions = yes
@R@   recycle:touch = yes
@R@   recycle:exclude = .pinas-upload-*
@R@   recycle:exclude_dir = .papierkorb,.tmp

[Gemeinsam]
   comment = Gemeinsamer Ordner fuer alle Benutzer
   path = @SHARED_DIR@
   valid users = @nasusers
   force user = pinas
   force group = pinas
   read only = no
   browseable = yes
   create mask = 0660
   directory mask = 0770
   veto files = @VETO@
   delete veto files = yes
@V@   vfs objects = @VFS@
@A@   full_audit:prefix = %u|%I|%m|%S
@A@   full_audit:success = connect openat mkdirat renameat unlinkat
@A@   full_audit:failure = none
@A@   full_audit:facility = LOCAL5
@A@   full_audit:priority = NOTICE
@R@   recycle:repository = .papierkorb
@R@   recycle:keeptree = yes
@R@   recycle:versions = yes
@R@   recycle:touch = yes
@R@   recycle:exclude = .pinas-upload-*
@R@   recycle:exclude_dir = .papierkorb,.tmp,.pinas
