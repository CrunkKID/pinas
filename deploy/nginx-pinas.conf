# PiNAS: verschlüsselte Weboberfläche (https). Die App selbst lauscht nur auf 127.0.0.1:8081.

# http und der alte Port 8080 leiten auf https um
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8080;
    listen [::]:8080;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/pinas/tls/server.crt;
    ssl_certificate_key /etc/pinas/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:pinas:1m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # SAMEORIGIN: Während einer Übertragung öffnet transfer.js andere Reiter in einem Rahmen derselben Seite
    add_header X-Frame-Options SAMEORIGIN always;

    # Große Uploads und Downloads direkt durchreichen statt auf der SD-Karte zwischenzuspeichern
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
